site_name: OTSO Documentation

theme:
  name: material
  favicon: assets/favicon.png
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: list
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            show_root_heading: true
            show_root_toc_entry: false

markdown_extensions:
  - md_in_html
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Functions:
      - Cutoff rigidities:
          - Cutoff: Cutoff.md
          - Cone: Cone.md
          - Planet: Planet.md
          - Flight: Flight.md
          - Transmission: Transmission.md
          - Skymap: Skymap.md
      - Trajectories and fields:
          - Trajectory: Trajectory.md
          - Trace: Trace.md
          - Magfield: Magfield.md
      - Utilities:
          - Coordtrans: Coordtrans.md
  - Input parameters:
      - Overview: Parameters.md
      - Field models:
          - Magnetic field models: params/magfield_params.md
          - Solar wind: params/solar_wind_params.md
          - Geomagnetic indices: params/geomagnetic_params.md
          - Tsyganenko coefficients: params/tsyganenko_params.md
          - Custom field and MHD grid: params/custom_field_params.md
      - Particle and integration:
          - Particle: params/particle_params.md
          - Rigidity scan: params/rigidity_params.md
          - Integration: params/integration_params.md
      - Outputs:
          - Asymptotic directions: params/asymptotic_params.md
          - Transmission function: params/transmission_params.md
          - Coordinate systems: params/coordinate_params.md
      - Run settings:
          - Date and time: params/datetime_params.md
          - Computation: params/computation_params.md
          - Data retrieval: params/data_retrieval_params.md
      - Grids:
          - Latitude-longitude grid: params/grid_params.md
          - Sky map grid: params/skymap_params.md
  - Guides:
      - MHD input: MHD.md
  - Command line: CLI.md
  - Publications: Publications.md
