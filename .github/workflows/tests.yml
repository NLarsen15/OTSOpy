name: Test Suite

# Tests the committed prebuilt libraries as a user would get them: the package is built into a
# wheel once, then installed and tested on every supported OS, CPU architecture and Python
# version. Nothing is compiled here; Build Fortran Extensions (build.yml) makes the libraries.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "mkdocs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "mkdocs.yml"]
  schedule:
    # Mondays 06:00 UTC: catches breakage from new releases of numpy, pandas, numba, f90wrap etc.
    - cron: "0 6 * * 1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quick checks that need no compiled code
  # ---------------------------------------------------------------------------
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Every Python version x platform has a library of the right architecture, and setup.py and CITATION.cff carry the same version. Writes a table to the
      # run summary.
      - name: Library inventory and version
        run: python tests/ci_checks.py

      - name: Byte-compile all Python sources
        run: python -m compileall -q OTSO tests

  # ---------------------------------------------------------------------------
  # Build the wheel and sdist once; every test job installs this same wheel
  # ---------------------------------------------------------------------------
  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          ls -la dist
          python -m twine check dist/*

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "OTSO/_core/libs/MiddleMan.py",
              "OTSO/_core/custom_classes/StationList.csv",
              "OTSO/_core/utils/igrf_coefficients.csv",
              "OTSO/_core/serverdata/Parameters.par",
              "OTSO/_core/serverdata/parameters.csv",
              "OTSO/_core/citation_generator/citations.json",
          ]
          missing = [r for r in required if r not in names]
          libs = sorted(n for n in names if "/_MiddleMan" in n)
          print(f"{whl}: {len(names)} files, {len(libs)} compiled libraries")
          for lib in libs:
              print("  ", lib)
          if missing or not libs:
              raise SystemExit(f"ERROR: wheel is missing {missing or 'all compiled libraries'}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Install the wheel and test on every platform and Python version
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.platform.name }} py${{ matrix.python-version }}
    needs: package
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only: Homebrew has no Intel gcc bottle, so macos-15-intel hangs building it.
        platform:
          - { name: linux-x64,   runner: ubuntu-22.04 }
          - { name: linux-arm64, runner: ubuntu-22.04-arm }
          - { name: macos-arm64, runner: macos-latest }
          - { name: windows-x64, runner: windows-latest }
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # The Linux and macOS libraries link libgfortran and libgomp dynamically. The Windows
      # libraries are statically linked, so no Rtools/MinGW is installed: this checks that a
      # Windows user doesn't need one.
      - name: Install Fortran runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgfortran5 libgomp1

      - name: Install Fortran runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Show environment
        run: |
          uname -a || true
          python -VV
          python -c "import os, platform; print(platform.machine(), os.cpu_count(), 'CPUs')"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # A fresh venv, so the test sees only what the wheel installs.
      - name: Install OTSO from the wheel
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then ACT=.venv/Scripts/activate; else ACT=.venv/bin/activate; fi
          echo "VENV_ACTIVATE=$PWD/$ACT" >> "$GITHUB_ENV"
          source "$ACT"
          python -m pip install --upgrade pip
          WHL=$(ls dist/*.whl)
          python -m pip install "${WHL}[test]" pytest-timeout
          python -m pip check
          python -m pip list

      # Run from outside the checkout so "import OTSO" can only find the installed package.
      - name: Prepare test directory
        run: |
          mkdir -p "$RUNNER_TEMP/otso_tests"
          cp -r tests pytest.ini "$RUNNER_TEMP/otso_tests/"
          cp "src/example codes/benchmark tests/cutoff_thread_test.py" "$RUNNER_TEMP/otso_tests/"

      - name: Load the compiled library
        working-directory: ${{ runner.temp }}/otso_tests
        run: |
          source "$VENV_ACTIVATE"
          python - <<'PY'
          import platform, subprocess, sys
          import OTSO
          from OTSO._core.libs import _MiddleMan
          print("OTSO", OTSO.__file__)
          print("library", _MiddleMan.__file__)
          if "site-packages" not in OTSO.__file__:
              raise SystemExit("ERROR: imported OTSO from the checkout, not the installed wheel")
          if sys.platform == "darwin":
              archs = subprocess.run(["lipo", "-archs", _MiddleMan.__file__], capture_output=True, text=True).stdout.split()
              print("architectures", archs)
              if platform.machine() not in archs:
                  raise SystemExit(f"ERROR: library has no {platform.machine()} slice")
          PY

      - name: Command-line entry points
        working-directory: ${{ runner.temp }}/otso_tests
        run: |
          source "$VENV_ACTIVATE"
          OTSO.liststations > stations.txt
          head -n 5 stations.txt

      # tests/test_examples.py runs every public function once; tests/test_regressions.py checks
      # the 1.3.15 fixes (Kp rounding, Boberg DST cap, Sun position before 1900).
      - name: Unit and regression tests
        working-directory: ${{ runner.temp }}/otso_tests
        run: |
          source "$VENV_ACTIVATE"
          python -m pytest -v -rA --timeout=900 --junitxml=junit.xml

      # Every corenum/threadnum combination must give identical results, five times over.
      - name: Thread and process consistency
        working-directory: ${{ runner.temp }}/otso_tests
        run: |
          source "$VENV_ACTIVATE"
          python cutoff_thread_test.py

      - name: Reference values for cross-platform comparison
        working-directory: ${{ runner.temp }}/otso_tests
        env:
          REF_LABEL: ${{ matrix.platform.name }} py${{ matrix.python-version }}
        run: |
          source "$VENV_ACTIVATE"
          python tests/ci_reference.py run "reference-${{ matrix.platform.name }}-py${{ matrix.python-version }}.json"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/otso_tests/junit.xml
            ${{ runner.temp }}/otso_tests/reference-*.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # All platforms should agree numerically
  # ---------------------------------------------------------------------------
  compare:
    name: Cross-platform consistency
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      # Compares every run against Linux x64 and writes a table to the run summary.
      - name: Compare reference values
        run: python tests/ci_reference.py compare results
